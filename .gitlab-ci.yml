stages:
  - test
  - audit
  - check_report
  - sonar

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  # The Dockerfile builder runs the suite too, but nothing in CI builds the image.
  NODE_IMAGE: node:22-bookworm-slim

test:
  image: $NODE_IMAGE
  stage: test
  tags: [docker]
  script:
    - npm ci --ignore-scripts
    - npm test

audit:
  image: $NODE_IMAGE
  stage: audit
  tags: [docker]
  script:
    - npm audit --omit=dev --json > audit.json || true
  artifacts:
    paths:
      - audit.json

check_report:
  image:
    name: stedolan/jq
    #entrypoint: [""]
  stage: check_report
  tags: [docker]
  script:
    # high and critical both block; the base image gets its own scan
    - high=$(jq '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical' audit.json)
    - echo "high+critical=$high"
    - if [ "$high" != 0 ]; then jq '.vulnerabilities' audit.json; exit 1; fi
  dependencies:
    - audit

sonar:
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [ "" ]
  stage: sonar
  tags: [docker]
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/

  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'
